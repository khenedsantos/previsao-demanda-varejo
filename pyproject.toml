[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "previsao-demanda-varejo"
version = "0.1.0"
description = "Previsão de demanda e simulação de políticas de reposição no varejo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "duckdb",
    "pyarrow",
    "statsmodels",
    "scikit-learn",
    "matplotlib",
    "jupyter",
    "pytest",
    "PyYAML",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
