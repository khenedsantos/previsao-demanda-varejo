simulation: true
description: >-
  Cenários simulados de política de reposição. Lead time e estoque físico
  não são fornecidos pela fonte. Os valores abaixo são hipóteses de planejamento,
  não observações, garantias de serviço ou recomendações calibradas.

# Alias legado: service_level = target_coverage_level nos outputs da Fase 8.
# Quantil alvo do erro histórico contra venda observada normalizada; não é
# fill rate, OTIF, ausência garantida de ruptura nem cobertura de demanda latente.
# Os três pares L/q são hipóteses fixas; flags de risco não multiplicam o buffer.
scenarios:
  lean:
    lead_time_days: 1
    service_level: 0.90
  base:
    lead_time_days: 2
    service_level: 0.95
  protected:
    lead_time_days: 3
    service_level: 0.98
